<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>得点発表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0 !important;
            padding: 0 !important;
            box-sizing: border-box !important;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000 !important;
        }

        body {
            font-family: 'Orbitron', monospace !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('/gazou/bg_01.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Good/Excellent画像オーバーレイ - コンテナ */
        .overlay-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .overlay-container.show {
            opacity: 1;
        }

        /* 静止画像（中央部分） */
        .overlay-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        
        .overlay-image.show {
            opacity: 1;
        }
        
        /* 上部の帯アニメーション（右から左に1回だけ） */
        @keyframes slideRight {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(0);
            }
        }
        
        /* 下部の帯アニメーション（左から右に1回だけ） */
        @keyframes slideLeft {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(0);
            }
        }
        
        /* 上部帯 */
        .top-band {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: auto;
            transform: translateX(100%);
            line-height: 0;
            font-size: 0;
            overflow: hidden;
        }
        
        .top-band.animate {
            animation: slideRight 0.7s ease-out forwards;
        }
        
        .top-band img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
        }
        
        /* 下部帯 */
        .bottom-band {
            position: fixed;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: auto;
            transform: translateX(-100%);
            line-height: 0;
            font-size: 0;
            overflow: hidden;
        }
        
        .bottom-band.animate {
            animation: slideLeft 0.7s ease-out forwards;
        }
        
        /* 帯キラキラエフェクト */
        .top-band.sparkle::after,
        .bottom-band.sparkle::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0) 20%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0) 80%,
                transparent 100%
            );
            animation: sparkle-shine 2s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes sparkle-shine {
            0% {
                left: -100%;
            }
            100% {
                left: 200%;
            }
        }
        
        .bottom-band img {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
        }

        /* 会社名表示 */
        .company-name {
            position: fixed;
            top: var(--company-name-position, 20%);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease-in;
            text-align: center;
        }
        
        .company-name canvas {
            display: block;
            margin: 0 auto;
        }

        .company-name.show {
            opacity: 1;
        }

        .company-name.hide {
            opacity: 0;
        }

        .font-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            background: rgba(20, 20, 20, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ff0000;
            max-height: 90vh;
            overflow-y: auto;
            display: none;
        }

        .font-selector::-webkit-scrollbar {
            width: 8px;
        }

        .font-selector::-webkit-scrollbar-track {
            background: #000000;
        }

        .font-selector::-webkit-scrollbar-thumb {
            background: #ff0000;
            border-radius: 4px;
        }

        .font-selector label {
            color: #ffffff;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 8px;
            font-family: 'Orbitron', monospace;
        }

        .font-selector select {
            width: 250px;
            padding: 8px;
            font-size: 1rem;
            background: #000000;
            color: #ff0000;
            border: 1px solid #ff0000;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            max-height: 400px;
        }

        .font-selector select:focus {
            outline: none;
            border-color: #ff3333;
        }

        .container {
            position: fixed;
            top: var(--score-top, 50%);
            left: var(--score-left, 50%);
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: var(--digit-gap, 15px);
            z-index: 5;
        }

        .score-display {
            display: flex;
            align-items: flex-end;
            gap: var(--digit-gap, 15px);
        }

        .digit-container {
            display: inline-block;
            overflow: hidden;
            height: calc(var(--digit-size, 18rem) * 0.95);
            width: calc(var(--digit-size, 18rem) * 0.61);
            position: relative;
            background: transparent;
            clip-path: inset(10% 0 10% 0);
        }

        .digit-roller {
            display: flex;
            flex-direction: column;
            transition: transform 0.05s linear;
        }

        .digit {
            font-size: var(--digit-size, 18rem) !important;
            font-weight: 700 !important;
            line-height: 1 !important;
            font-family: var(--digit-font, 'Poppins'), sans-serif !important;
            font-variant-numeric: tabular-nums !important;
            height: var(--digit-size, 18rem);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.05em;
            color: transparent !important;
            position: relative;
        }
        
        .digit canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .unit {
            font-size: 3.5rem !important;
            font-weight: 600 !important;
            font-family: var(--digit-font, 'Orbitron'), monospace !important;
            padding-bottom: 0.5rem;
            align-self: flex-end;
            color: #002856 !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .start-button {
            display: none;
        }
        
        /* 紙吹雪アニメーション */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
            visibility: hidden;
        }
        
        .confetti-container.active {
            visibility: visible;
        }
        
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffd700;
            top: -100px;
            animation: confetti-fall 3s linear forwards;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 光の爆発アニメーション */
        .burst-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 99;
        }
        
        .burst-ray {
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 200px;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 1), rgba(255, 215, 0, 0));
            transform-origin: top center;
            animation: burst-expand 1s ease-out forwards;
        }
        
        @keyframes burst-expand {
            0% {
                height: 0;
                opacity: 1;
            }
            50% {
                height: 300px;
                opacity: 1;
            }
            100% {
                height: 400px;
                opacity: 0;
            }
        }
        
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8), transparent 70%);
            pointer-events: none;
            z-index: 98;
            animation: flash 0.5s ease-out forwards;
        }
        
        @keyframes flash {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        
        /* 星の輝きアニメーション */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
        
        .star {
            position: absolute;
            width: 20px;
            height: 20px;
            background: gold;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: star-twinkle 2s ease-in-out forwards;
        }
        
        @keyframes star-twinkle {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* 虹の波アニメーション */
        .rainbow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }
        
        .rainbow-wave {
            position: absolute;
            width: 100%;
            height: 200px;
            background: linear-gradient(90deg, 
                rgba(255,0,0,0.7) 0%, 
                rgba(255,154,0,0.7) 10%, 
                rgba(208,222,33,0.7) 20%, 
                rgba(79,220,74,0.7) 30%, 
                rgba(63,218,216,0.7) 40%, 
                rgba(47,201,226,0.7) 50%, 
                rgba(28,127,238,0.7) 60%, 
                rgba(95,21,242,0.7) 70%, 
                rgba(186,12,248,0.7) 80%, 
                rgba(251,7,217,0.7) 90%, 
                rgba(255,0,0,0.7) 100%);
            animation: rainbow-wave-move 2s ease-out forwards;
        }
        
        @keyframes rainbow-wave-move {
            0% {
                top: -200px;
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }
        
        /* 花火アニメーション */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
        
        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: firework-explode 1.5s ease-out forwards;
        }
        
        @keyframes firework-explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        
        /* ハートアニメーション */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }
        
        .heart {
            position: absolute;
            font-size: 30px;
            animation: heart-float 3s ease-in forwards;
        }
        
        @keyframes heart-float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }
        
        /* 稲妻アニメーション */
        .lightning-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
        
        .lightning {
            position: absolute;
            width: 3px;
            background: linear-gradient(to bottom, #fff, #ffff00, #fff);
            box-shadow: 0 0 10px #fff, 0 0 20px #ffff00;
            animation: lightning-strike 0.3s ease-out forwards;
        }
        
        @keyframes lightning-strike {
            0% {
                opacity: 0;
                height: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                height: 100%;
            }
        }
        
        .lightning-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 98;
            animation: flash-quick 0.1s ease-out forwards;
        }
        
        @keyframes flash-quick {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        
        /* キラキラ粒子アニメーション */
        .sparkles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
        
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #fff, transparent);
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: sparkle-rise 2.5s ease-out forwards;
        }
        
        @keyframes sparkle-rise {
            0% {
                transform: translateY(20px) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }
        
        /* スポットライトアニメーション */
        .spotlight-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: rgba(0, 0, 0, 0.7);
            animation: spotlight-fade 3s ease-out forwards;
        }
        
        .spotlight {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 200, 0.8), transparent 70%);
            border-radius: 50%;
            animation: spotlight-rotate 3s linear forwards;
        }
        
        @keyframes spotlight-rotate {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
            }
            100% {
                transform: translate(-50%, -50%) scale(2) rotate(720deg);
            }
        }
        
        @keyframes spotlight-fade {
            0% {
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        
        /* パルス波アニメーション */
        .pulse-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 99;
        }
        
        .pulse-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border: 4px solid #00ffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-expand 2s ease-out forwards;
        }
        
        @keyframes pulse-expand {
            0% {
                width: 100px;
                height: 100px;
                opacity: 1;
            }
            100% {
                width: 1000px;
                height: 1000px;
                opacity: 0;
            }
        }
    </style>
</head>

    <script>
        const socket = io();
        let totalScore = 0;
        let animationRunning = false;
        let currentClientName = '';
        let teamNames = ['A', 'B', 'C', 'D', 'E', 'F']; // デフォルト
        let currentTeamName = ''; // 現在表示中のチーム名
        let perfectEffect = 'none';
        
        // Canvas + JavaScriptで数字を描画
        function drawDigitOnCanvas(canvas, digit) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // キャンバスをクリア
            ctx.clearRect(0, 0, width, height);
            
            // 右上から左下への斜めグラデーション（数字用設定値を使用）
            const gradient = ctx.createLinearGradient(width * 0.9, height * 0.1, width * 0.1, height * 0.9);
            gradient.addColorStop(0, digitGradientColors.color1);
            gradient.addColorStop(0.5, digitGradientColors.color2);
            gradient.addColorStop(1, digitGradientColors.color3);
            
            // 影を設定（数字用設定値を使用）
            const opacity = digitShadowOpacity / 100;
            ctx.shadowColor = `rgba(30, 90, 158, ${opacity})`;
            ctx.shadowBlur = digitShadowBlur;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 3;
            
            // フォント設定
            ctx.font = `bold ${height * 0.8}px Poppins, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 縁（アウトライン）を描画
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.strokeText(digit, width / 2, height / 2);
            
            // 数字を描画（塗りつぶし）
            ctx.fillStyle = gradient;
            ctx.fillText(digit, width / 2, height / 2);
        }
        
        // 会社名をCanvasで描画
        function drawCompanyNameOnCanvas(canvas, text) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // キャンバスをクリア
            ctx.clearRect(0, 0, width, height);
            
            // 右上から左下への斜めグラデーション（チーム名用）
            const gradient = ctx.createLinearGradient(width * 0.9, height * 0.1, width * 0.1, height * 0.9);
            gradient.addColorStop(0, companyGradientColors.color1);
            gradient.addColorStop(0.5, companyGradientColors.color2);
            gradient.addColorStop(1, companyGradientColors.color3);
            
            // 影を設定（チーム名用）
            const opacity = companyShadowOpacity / 100;
            ctx.shadowColor = `rgba(30, 90, 158, ${opacity})`;
            ctx.shadowBlur = companyShadowBlur;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 3;
            
            // フォント設定
            ctx.font = `bold 80px Poppins, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // テキストを描画（塗りつぶし）
            ctx.fillStyle = gradient;
            ctx.fillText(text, width / 2, height / 2);
        }

                        firework.style.setProperty('--ty', ty + 'px');
                        firework.style.transform = `translate(var(--tx), var(--ty))`;

            // アニメーションをリセット（重要：animateクラスを外した後に初期位置に戻す）
            setTimeout(() => {
                topBand.style.transform = 'translateX(100%)';
                bottomBand.style.transform = 'translateX(-100%)';
            }, 10);
            // 会社名は非表示にしない（常に表示）
        }

        function showOverlayAndCompany(score, clientName) {
            const overlayContainer = document.getElementById('overlayContainer');
            const overlayImage = document.getElementById('overlayImage');
            const topBandImg = document.getElementById('topBandImg');
            const bottomBandImg = document.getElementById('bottomBandImg');
            const topBand = document.querySelector('.top-band');
            const bottomBand = document.querySelector('.bottom-band');
            
            console.log('showOverlayAndCompany called, score:', score);
            console.log('topBand element:', topBand);
            console.log('topBand initial transform:', window.getComputedStyle(topBand).transform);
            
            // スコアに応じて帯画像を選択（中央画像は使わない）
            if (score >= 80) {
                topBandImg.src = '/gazou/excellent_obi.png';
                bottomBandImg.src = '/gazou/excellent_obi.png';
            } else if (score >= 0) {
                topBandImg.src = '/gazou/good_obi.png';
                bottomBandImg.src = '/gazou/good_obi.png';
            } else {
                topBandImg.src = '';
                bottomBandImg.src = '';
            }
            
            // 会社名を更新（現在のラウンドのチーム名を常に使用）
            console.log('表示するチーム名:', currentTeamName);
            updateCompanyName(currentTeamName);
            
            // 画像表示
            if (score >= 0) {
                console.log('Score >= 0, showing overlay and starting animation');
                overlayContainer.classList.add('show');
                
                // 確実に初期位置に戻す
                topBand.style.transform = 'translateX(100%)';
                bottomBand.style.transform = 'translateX(-100%)';
                
                // 帯のアニメーション開始
                setTimeout(() => {
                    console.log('Adding animate class to bands');
                    topBand.classList.add('animate');
                    bottomBand.classList.add('animate');
                    console.log('topBand classes:', topBand.className);
                    
                    // スコアに応じてSEを再生（0.2秒遅延）
                    setTimeout(() => {
                        if (score >= 80) {
                            const excellentSound = document.getElementById('soundExcellent');
                            excellentSound.currentTime = 0;
                            excellentSound.play();
                        } else if (score >= 0) {
                            const goodSound = document.getElementById('soundGood');
                            goodSound.currentTime = 0;
                            goodSound.play();
                        }
                    }, 200);
                }, 100);
                
                // 100点ピッタリの時だけ特別演出
                if (score === 100) {
                    setTimeout(() => {
                        if (perfectEffect === 'confetti') {
                            createConfetti();
                        } else if (perfectEffect === 'stars') {
                            createStars();
                        } else if (perfectEffect === 'fireworks') {
                            createFireworks();
                        } else if (perfectEffect === 'sparkle-band') {
                            // 帯にキラキラクラスを追加
                            topBand.classList.add('sparkle');
                            bottomBand.classList.add('sparkle');
                            
                            // 3秒後にキラキラを停止
                            setTimeout(() => {
                                topBand.classList.remove('sparkle');
                                bottomBand.classList.remove('sparkle');
                            }, 3000);
                        }
                    }, 500);
                }
            }
        }

        function startAnimation() {
            animationRunning = true;
            const soundNo1 = document.getElementById('soundNo1');
            const soundNo2 = document.getElementById('soundNo2_11sec');
            const soundNo3 = document.getElementById('soundNo3');
            const soundNo4 = document.getElementById('soundNo4');
            
            console.log('アニメーション開始 - 合計点:', totalScore);
            console.log('停止タイミング設定:', stopTiming);
            
            // No.1とNo.3を同時に再生
            soundNo1.play().then(() => {
                console.log('No.1 再生開始');
            }).catch(e => {
                console.error('No.1 再生エラー:', e);
            });
            
            soundNo3.play().then(() => {
                console.log('No.3 再生開始');
            }).catch(e => {
                console.error('No.3 再生エラー:', e);
            });
            
            // No.2を十の位の停止タイミングで再生
            setTimeout(() => {
                soundNo2.play().then(() => {
                    console.log(`No.2 (十の位: ${stopTiming.digit1}ms) 再生開始`);
                }).catch(e => {
                    console.error('No.2 (十の位) 再生エラー:', e);
                });
            }, stopTiming.digit1);
            
            // No.4を一の位の停止タイミングで再生
            setTimeout(() => {
                soundNo4.play().then(() => {
                    console.log(`No.4 (一の位: ${stopTiming.digit2}ms) 再生開始`);
                }).catch(e => {
                    console.error('No.4 (一の位) 再生エラー:', e);
                });
            }, stopTiming.digit2);
            
            // 表示点数を合計-1に変更（最小0、最大99）
            const displayScore = Math.max(0, Math.min(99, totalScore - 1));
            
            // 数字を分解（最大2桁）
            const digits = String(displayScore).padStart(2, '0').split('').map(Number);
            
            // スロットアニメーション開始
            startSlotAnimation(digits);
        }

        function startSlotAnimation(targetDigits) {
            const rollers = [
                document.getElementById('digit1'),
                document.getElementById('digit0')
            ];
            
            // 最終的な回転間隔（最高速度）
            const finalRollSpeeds = [
                70,  // 70ms（少し遅めで見やすく）
                70
            ];
            
            // 初期速度（遅い）
            const initialRollSpeeds = [
                300,  // 300ms（よりゆっくり）
                310
            ];
            
            // 現在の速度
            let currentSpeeds = [...initialRollSpeeds];
            
            let currentPositions = [0, 0];
            let lastRotateTime = [Date.now(), Date.now()];
            let stopped = [false, false]; // 各桁の停止フラグ
            let started = [false, false]; // 各桁の開始フラグ
            
            // 各桁の開始遅延（十の位、一の位の順）
            const startDelays = [0, 400]; // 0ms, 400ms
            
            // 加速処理（0〜7秒で徐々に速度を上げる）
            const accelerationDuration = 7000; // 7秒
            const startTime = Date.now();
            
            // requestAnimationFrameで滑らかに回転
            const animate = () => {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / accelerationDuration, 1); // 0〜1
                
                // 各桁の速度を計算（イージング関数で滑らかに）
                for (let i = 0; i < 2; i++) {
                    // 開始遅延チェック
                    if (!started[i]) {
                        if (elapsed >= startDelays[1 - i]) { // 逆順で開始（0の位→1の位）
                            started[i] = true;
                            lastRotateTime[i] = Date.now();
                        } else {
                            continue; // まだ開始時間ではない
                        }
                    }
                    
                    // 停止済みの桁はスキップ
                    if (stopped[i]) continue;
                    
                    // 2次関数でイージング（滑らかに加速）
                    const easedProgress = progress * progress;
                    currentSpeeds[i] = initialRollSpeeds[i] + (finalRollSpeeds[i] - initialRollSpeeds[i]) * easedProgress;
                    
                    // 現在の速度に応じて回転
                    const now = Date.now();
                    if (now - lastRotateTime[i] >= currentSpeeds[i]) {
                        currentPositions[i] = currentPositions[i] + 1;
                        
                        const digitSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--digit-size')) || 18;
                        const transitionDuration = currentSpeeds[i] / 1000;
                        
                        // 20まで行ったら0にリセット（0-9が2回繰り返されているので）
                        if (currentPositions[i] >= 20) {
                            // transitionなしで瞬時に0に戻す
                            rollers[i].style.transition = 'none';
                            rollers[i].style.transform = `translateY(0)`;
                            currentPositions[i] = 0;
                            
                            // 次のフレームで通常の回転を再開
                            requestAnimationFrame(() => {
                                currentPositions[i] = 1;
                                rollers[i].style.transition = `transform ${transitionDuration}s linear`;
                                rollers[i].style.transform = `translateY(-${digitSize}rem)`;
                            });
                        } else {
                            // 通常の回転
                            rollers[i].style.transition = `transform ${transitionDuration}s linear`;
                            rollers[i].style.transform = `translateY(-${currentPositions[i] * digitSize}rem)`;
                        }
                        
                        lastRotateTime[i] = now;
                    }
                }
                
                // アニメーション継続（いずれかが回転中なら続ける）
                if (animationRunning && stopped.some(s => !s)) {
                    requestAnimationFrame(animate);
                }
            };
            
            // アニメーション開始
            requestAnimationFrame(animate);
            
            // 回転停止のタイミング
            const stopRolling = () => {
                console.log('スロット停止開始');
                
                // 一の位を停止（設定されたタイミングで）
                setTimeout(() => {
                    stopped[1] = true;
                    snapToTarget(rollers[1], targetDigits[1]);
                    console.log('一の位 停止');
                }, stopTiming.digit1);
                
                // 十の位を停止
                setTimeout(() => {
                    stopped[0] = true;
                    snapToTarget(rollers[0], targetDigits[0]);
                    console.log('十の位 停止 - 完了！');
                    
                    // アニメーション完了後、オーバーレイと会社名を表示
                    setTimeout(() => {
                        showOverlayAndCompany(totalScore, currentClientName);
                    }, 1300);
                }, stopTiming.digit2);
            };
            
            // タイマーで停止
            setTimeout(stopRolling, 100); // すぐに停止タイミングを計算
        }

        // バン！と止める（強制的に目標の数字に移動）
        function snapToTarget(roller, targetDigit) {
            roller.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            const digitSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--digit-size')) || 18;
            roller.style.transform = `translateY(-${targetDigit * digitSize}rem)`;
        }

        // 色変更（無効化）
        // 初期色を適用（濃紺色）
    </script>
