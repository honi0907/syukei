<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>観覧用 - 全セット点数一覧</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="viewer-excel-page">
    <header class="viewer-excel-header">
        <div>
            <h1>点数集計（全セット一覧）</h1>
            <p class="viewer-excel-lead" id="leadLine">上段：セット1〜2　中段：セット3〜4　下段：セット5〜6。セット名を押すとそのセットだけ大きく表示します。</p>
        </div>
        <div class="viewer-excel-actions">
            <button type="button" class="btn btn-primary" id="refreshBtn">更新</button>
            <button type="button" class="btn btn-primary" id="csvBtn">Excel</button>
            <span class="viewer-excel-live" id="liveBadge" hidden><span class="viewer-excel-dot"></span>接続中</span>
        </div>
    </header>

    <p class="viewer-excel-meta" id="metaLine">読み込み中…</p>
    <div class="viewer-focus-bar" id="focusBar"></div>
    <div class="viewer-excel-stack" id="matrixStack"></div>
    <p id="emptyHint" class="viewer-excel-empty" hidden>接続中の子機がありません。</p>

    <script>
        const socket = io();
        const TEAM_COUNT = 6;
        let focusedSet = null;
        let latestMatrix = null;
        const BANDS = [
            { title: 'セット１〜２', indices: [0, 1] },
            { title: 'セット３〜４', indices: [2, 3] },
            { title: 'セット５〜６', indices: [4, 5] }
        ];

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatTeamLabel(name, index) {
            const raw = (name || '').replace(/チーム/g, '').trim();
            if (raw) {
                return raw;
            }
            return ['A', 'B', 'C', 'D', 'E', 'F'][index] || String(index + 1);
        }

        function nameLabel(participant) {
            const display = (participant.displayName || '').trim();
            const id = participant.id || '';
            if (display && display !== id) {
                return `${id} ${display}`;
            }
            return display || id;
        }

        function groupClass(setBlock, currentSet, teamIndex, currentRound) {
            const selected = setBlock.set === currentSet && teamIndex === currentRound - 1;
            return [
                'set-group',
                setBlock.set === currentSet ? 'set-group-current' : '',
                selected ? 'team-selected' : ''
            ].filter(Boolean).join(' ');
        }

        function buildBand(matrix, band, currentSet, currentRound) {
            const setHeader = band.indices.map((setIdx) => {
                const setBlock = matrix.sets[setIdx];
                const cls = setBlock.set === currentSet ? 'set-group set-group-current' : 'set-group';
                return `<th colspan="${TEAM_COUNT}" class="${cls}"><button type="button" class="viewer-set-zoom" data-set="${setBlock.set}">${escapeHtml(setBlock.setName)}</button></th>`;
            }).join('');

            const teamHeader = band.indices.map((setIdx) => {
                const setBlock = matrix.sets[setIdx];
                return setBlock.teamNames.map((name, i) =>
                    `<th class="${groupClass(setBlock, currentSet, i, currentRound)} team-col" title="${escapeHtml(name)}">${escapeHtml(formatTeamLabel(name, i))}</th>`
                ).join('');
            }).join('');

            const body = matrix.participants.map((p) => {
                const scores = band.indices.map((setIdx) => {
                    const setBlock = matrix.sets[setIdx];
                    return p.scoresBySet[setIdx].map((score, i) =>
                        `<td class="num ${groupClass(setBlock, currentSet, i, currentRound)}">${score}</td>`
                    ).join('');
                }).join('');
                return `
                    <tr>
                        <td class="sticky-col sticky-name" title="${escapeHtml(p.id)}">${escapeHtml(nameLabel(p))}</td>
                        ${scores}
                    </tr>
                `;
            }).join('');

            const totals = band.indices.map((setIdx) => {
                const setBlock = matrix.sets[setIdx];
                return setBlock.teamTotals.map((t, i) =>
                    `<td class="num ${groupClass(setBlock, currentSet, i, currentRound)}">${t}</td>`
                ).join('');
            }).join('');

            const cols = `<col class="viewer-col-name">${band.indices.map(() =>
                Array.from({ length: TEAM_COUNT }, () => '<col class="viewer-col-team">').join('')
            ).join('')}`;

            return `
                <section class="viewer-excel-band">
                    <h2 class="viewer-excel-band-title">${escapeHtml(band.title)}</h2>
                    <div class="viewer-excel-wrap">
                        <table class="excel-matrix">
                            <colgroup>${cols}</colgroup>
                            <thead>
                                <tr class="head-set-row">
                                    <th class="sticky-col sticky-name" rowspan="2">名前</th>
                                    ${setHeader}
                                </tr>
                                <tr class="head-team-row">${teamHeader}</tr>
                            </thead>
                            <tbody>${body}</tbody>
                            <tfoot>
                                <tr class="totals-row">
                                    <td class="sticky-col">チーム合計</td>
                                    ${totals}
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </section>
            `;
        }

        function renderFocusBar(matrix) {
            const buttons = [`<button type="button" class="viewer-focus-btn${focusedSet ? '' : ' is-active'}" data-set="0">一覧</button>`];
            matrix.sets.forEach((setBlock) => {
                const active = focusedSet === setBlock.set ? ' is-active' : '';
                buttons.push(
                    `<button type="button" class="viewer-focus-btn${active}" data-set="${setBlock.set}">${escapeHtml(setBlock.setName)}</button>`
                );
            });
            document.getElementById('focusBar').innerHTML = buttons.join('');
        }

        function setFocusedSet(setNumber) {
            focusedSet = setNumber >= 1 ? setNumber : null;
            if (latestMatrix) {
                renderMatrix(latestMatrix);
            }
        }

        function renderMatrix(matrix) {
            latestMatrix = matrix;
            const stack = document.getElementById('matrixStack');
            const empty = document.getElementById('emptyHint');
            const meta = document.getElementById('metaLine');
            const lead = document.getElementById('leadLine');
            const currentSet = matrix.currentSet || 1;
            const currentRound = matrix.currentRound || 1;
            document.body.classList.toggle('is-focused', Boolean(focusedSet));
            renderFocusBar(matrix);

            if (!matrix.participants.length) {
                stack.innerHTML = '';
                empty.hidden = false;
            } else if (focusedSet && matrix.sets[focusedSet - 1]) {
                empty.hidden = true;
                const setBlock = matrix.sets[focusedSet - 1];
                stack.innerHTML = buildBand(
                    matrix,
                    { title: setBlock.setName, indices: [focusedSet - 1] },
                    currentSet,
                    currentRound
                );
                lead.textContent = `${setBlock.setName} を大きく表示中。一覧で全セットに戻ります。`;
            } else {
                focusedSet = null;
                document.body.classList.remove('is-focused');
                empty.hidden = true;
                stack.innerHTML = BANDS.map((band) => buildBand(matrix, band, currentSet, currentRound)).join('');
                lead.textContent = '上段：セット1〜2　中段：セット3〜4　下段：セット5〜6。セット名を押すとそのセットだけ大きく表示します。';
            }

            const currentSetName = matrix.sets[currentSet - 1]?.setName || `セット${currentSet}`;
            const parts = [`操作中: ${currentSetName} / チーム${matrix.currentRound || 1}`];
            if (matrix.generatedAt) {
                parts.push(`更新: ${new Date(matrix.generatedAt).toLocaleString('ja-JP')}`);
            }
            meta.textContent = parts.join('　');
        }

        async function loadMatrix() {
            try {
                const res = await fetch('/api/scores-matrix/all', { cache: 'no-store' });
                if (!res.ok) {
                    throw new Error('fetch failed');
                }
                renderMatrix(await res.json());
            } catch {
                document.getElementById('metaLine').textContent =
                    'データを取得できませんでした。親機が起動しているか確認してください。';
            }
        }

        document.getElementById('focusBar').addEventListener('click', (event) => {
            const button = event.target.closest('[data-set]');
            if (!button) {
                return;
            }
            setFocusedSet(Number(button.dataset.set));
        });
        document.getElementById('matrixStack').addEventListener('click', (event) => {
            const button = event.target.closest('.viewer-set-zoom');
            if (!button) {
                return;
            }
            setFocusedSet(Number(button.dataset.set));
        });

        document.getElementById('refreshBtn').addEventListener('click', loadMatrix);
        document.getElementById('csvBtn').addEventListener('click', () => {
            window.location.href = '/api/scores-matrix-all.xlsx';
        });

        function bindRealtime() {
            loadMatrix();
            socket.emit('request-scores-matrix-all');
        }

        socket.on('connect', () => {
            document.getElementById('liveBadge').hidden = false;
            bindRealtime();
        });
        socket.on('disconnect', () => {
            document.getElementById('liveBadge').hidden = true;
        });
        socket.on('scores-matrix-all', (data) => renderMatrix(data));
        socket.on('score-updated', bindRealtime);
        socket.on('set-changed', bindRealtime);
        socket.on('team-names', bindRealtime);
        socket.on('client-connected', bindRealtime);
        socket.on('client-disconnected', bindRealtime);
        socket.on('round-changed', bindRealtime);

        loadMatrix();
    </script>
</body>
</html>
