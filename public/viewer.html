<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>観覧用 - 全セット点数一覧</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="viewer-excel-page">
    <header class="viewer-excel-header">
        <div>
            <h1>点数集計（全セット一覧）</h1>
            <p class="viewer-excel-lead">上段：セット1〜3　下段：セット4〜6（各6チーム）。確定点数のみ表示。</p>
        </div>
        <div class="viewer-excel-actions">
            <button type="button" class="btn btn-primary" id="refreshBtn">更新</button>
            <button type="button" class="btn btn-primary" id="csvBtn">CSV</button>
            <span class="viewer-excel-live" id="liveBadge" hidden><span class="viewer-excel-dot"></span>接続中</span>
        </div>
    </header>

    <p class="viewer-excel-meta" id="metaLine">読み込み中…</p>
    <div class="viewer-excel-stack" id="matrixStack"></div>
    <p id="emptyHint" class="viewer-excel-empty" hidden>接続中の子機がありません。</p>

    <script>
        const socket = io();
        const TEAM_COUNT = 6;
        const BANDS = [
            { title: 'セット１〜３', indices: [0, 1, 2] },
            { title: 'セット４〜６', indices: [3, 4, 5] }
        ];

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatTeamShort(name, index) {
            const raw = (name || '').replace(/チーム/g, '').trim();
            if (raw) {
                return raw.length > 8 ? `${raw.slice(0, 8)}…` : raw;
            }
            return ['A', 'B', 'C', 'D', 'E', 'F'][index] || String(index + 1);
        }

        function nameLabel(participant) {
            const display = (participant.displayName || '').trim();
            const id = participant.id || '';
            if (display && display !== id) {
                return `${id} ${display}`;
            }
            return display || id;
        }

        function buildBand(matrix, band, currentSet) {
            const setHeader = band.indices.map((setIdx) => {
                const setBlock = matrix.sets[setIdx];
                const cls = setBlock.set === currentSet ? 'set-group set-group-current' : 'set-group';
                return `<th colspan="${TEAM_COUNT}" class="${cls}">${escapeHtml(setBlock.setName)}</th>`;
            }).join('');

            const teamHeader = band.indices.map((setIdx) => {
                const setBlock = matrix.sets[setIdx];
                const cls = setBlock.set === currentSet ? 'set-group set-group-current' : 'set-group';
                return setBlock.teamNames.map((name, i) =>
                    `<th class="${cls} team-col" title="${escapeHtml(name)}">${escapeHtml(formatTeamShort(name, i))}</th>`
                ).join('');
            }).join('');

            const body = matrix.participants.map((p) => {
                const scores = band.indices.map((setIdx) => {
                    const setBlock = matrix.sets[setIdx];
                    const cls = setBlock.set === currentSet ? 'set-group set-group-current' : 'set-group';
                    return p.scoresBySet[setIdx].map((score) =>
                        `<td class="num ${cls}">${score}</td>`
                    ).join('');
                }).join('');
                return `
                    <tr>
                        <td class="sticky-col sticky-name" title="${escapeHtml(p.id)}">${escapeHtml(nameLabel(p))}</td>
                        ${scores}
                    </tr>
                `;
            }).join('');

            const totals = band.indices.map((setIdx) => {
                const setBlock = matrix.sets[setIdx];
                const cls = setBlock.set === currentSet ? 'set-group set-group-current' : 'set-group';
                return setBlock.teamTotals.map((t) => `<td class="num ${cls}">${t}</td>`).join('');
            }).join('');

            return `
                <section class="viewer-excel-band">
                    <h2 class="viewer-excel-band-title">${escapeHtml(band.title)}</h2>
                    <div class="viewer-excel-wrap">
                        <table class="excel-matrix">
                            <thead>
                                <tr class="head-set-row">
                                    <th class="sticky-col sticky-name" rowspan="2">名前</th>
                                    ${setHeader}
                                </tr>
                                <tr class="head-team-row">${teamHeader}</tr>
                            </thead>
                            <tbody>${body}</tbody>
                            <tfoot>
                                <tr class="totals-row">
                                    <td class="sticky-col">チーム合計</td>
                                    ${totals}
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </section>
            `;
        }

        function renderMatrix(matrix) {
            const stack = document.getElementById('matrixStack');
            const empty = document.getElementById('emptyHint');
            const meta = document.getElementById('metaLine');
            const currentSet = matrix.currentSet || 1;

            if (!matrix.participants.length) {
                stack.innerHTML = '';
                empty.hidden = false;
            } else {
                empty.hidden = true;
                stack.innerHTML = BANDS.map((band) => buildBand(matrix, band, currentSet)).join('');
            }

            const currentSetName = matrix.sets[currentSet - 1]?.setName || `セット${currentSet}`;
            const parts = [`操作中: ${currentSetName} / チーム${matrix.currentRound || 1}`];
            if (matrix.generatedAt) {
                parts.push(`更新: ${new Date(matrix.generatedAt).toLocaleString('ja-JP')}`);
            }
            meta.textContent = parts.join('　');
        }

        async function loadMatrix() {
            try {
                const res = await fetch('/api/scores-matrix/all', { cache: 'no-store' });
                if (!res.ok) {
                    throw new Error('fetch failed');
                }
                renderMatrix(await res.json());
            } catch {
                document.getElementById('metaLine').textContent =
                    'データを取得できませんでした。親機が起動しているか確認してください。';
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadMatrix);
        document.getElementById('csvBtn').addEventListener('click', () => {
            window.location.href = '/api/scores-matrix-all.csv';
        });

        function bindRealtime() {
            loadMatrix();
            socket.emit('request-scores-matrix-all');
        }

        socket.on('connect', () => {
            document.getElementById('liveBadge').hidden = false;
            bindRealtime();
        });
        socket.on('disconnect', () => {
            document.getElementById('liveBadge').hidden = true;
        });
        socket.on('scores-matrix-all', (data) => renderMatrix(data));
        socket.on('score-updated', bindRealtime);
        socket.on('set-changed', bindRealtime);
        socket.on('team-names', bindRealtime);
        socket.on('client-connected', bindRealtime);
        socket.on('client-disconnected', bindRealtime);
        socket.on('round-changed', bindRealtime);

        loadMatrix();
    </script>
</body>
</html>
