<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>観覧用 - 点数表示</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .viewer-page {
            background: #1a1a1a;
            color: white;
        }

        .viewer-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .viewer-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .viewer-header h1 {
            font-size: 3rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .team-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .team-header-row {
            display: flex;
            justify-content: center;
        }

        .team-score-card {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 3px solid #444;
        }

        .team-score-card.current {
            border-color: #ffd700;
        }

        .team-name {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .team-score-card.current .team-name {
            color: #ffd700;
        }

        .team-score {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .team-unit {
            font-size: 1.5rem;
            color: #aaa;
            margin-left: 5px;
        }

        .clients-display {
            display: contents;
        }

        .team-clients-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .clients-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
        }

        .clients-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .client-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #6c757d;
        }

        .client-item.active {
            border-left-color: #28a745;
        }

        .client-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #212529;
        }

        .client-score {
            font-size: 2rem;
            font-weight: 700;
            color: #212529;
        }

        .client-status {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 5px;
        }

        .connection-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .connection-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="viewer-page">
    <div class="connection-indicator">
        <span class="connection-dot"></span>
        <span>接続中</span>
    </div>

    <div class="viewer-container">
        <div class="viewer-header">
            <h1>点数集計システム</h1>
        </div>

        <div class="scores-grid" id="scoresGrid">
            <!-- チームスコアカードがここに表示される -->
        </div>

        <div class="clients-display">
            <div class="clients-grid" id="clientsGrid">
                <!-- 子機情報がここに表示される -->
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let allRoundsData = {}; // 全ラウンドの子機データ
        let currentRound = 1;
        let teamTotals = [0, 0, 0, 0, 0];
        const teamNames = ['A', 'B', 'C', 'D', 'E'];

        // 初回接続時
        socket.on('connect', () => {
            console.log('サーバーに接続しました');
            socket.emit('request-current-round');
            socket.emit('request-team-totals');
            socket.emit('request-all-rounds-data');
        });

        // チーム別の合計を受信
        socket.on('team-totals', (data) => {
            console.log('チーム別合計受信:', data);
            teamTotals = data.teams.map(team => team.score || 0);
            updateDisplay();
        });

        // 全ラウンドデータを受信
        socket.on('all-rounds-data', (data) => {
            console.log('全ラウンドデータ受信:', data);
            allRoundsData = data.rounds;
            updateDisplay();
        });

        // 現在のラウンドを受信
        socket.on('current-round', (round) => {
            currentRound = round;
            updateDisplay();
        });

        // ラウンド変更を受信
        socket.on('round-changed', (round) => {
            currentRound = round;
            updateDisplay();
        });

        // 子機情報を受信（全ラウンドデータを再取得）
        socket.on('clients-data', (data) => {
            socket.emit('request-all-rounds-data');
        });

        socket.on('client-connected', (data) => {
            socket.emit('request-all-rounds-data');
        });

        socket.on('score-updated', (data) => {
            socket.emit('request-all-rounds-data');
            socket.emit('request-team-totals');
        });

        socket.on('client-disconnected', (data) => {
            socket.emit('request-all-rounds-data');
        });

        // 表示を更新
        function updateDisplay() {
            const scoresGrid = document.getElementById('scoresGrid');
            
            // 全チームの合計を表示
            scoresGrid.innerHTML = '';
            
            teamNames.forEach((name, index) => {
                const teamScore = teamTotals[index] || 0;
                const isCurrent = (index + 1) === currentRound;
                const roundNum = index + 1;
                
                const section = document.createElement('div');
                section.className = 'team-section';
                
                // チーム合計カード
                const teamCard = `
                    <div class="team-score-card ${isCurrent ? 'current' : ''}">
                        <div class="team-name">${name}</div>
                        <div class="team-score">
                            ${teamScore}<span class="team-unit">点</span>
                        </div>
                    </div>
                `;
                
                // そのチーム（ラウンド）の子機リスト
                const clientsList = allRoundsData[roundNum] || [];
                let clientsHTML = '<div class="team-clients-grid">';
                
                if (clientsList.length === 0) {
                    clientsHTML += '<div class="client-item"><div class="client-name">-</div><div class="client-score">0点</div></div>';
                } else {
                    clientsList.forEach(client => {
                        const score = client.score !== null && client.score !== undefined ? client.score : 0;
                        const isActive = score > 0;
                        
                        clientsHTML += `
                            <div class="client-item ${isActive ? 'active' : ''}">
                                <div class="client-name">${client.name}</div>
                                <div class="client-score">${score}点</div>
                            </div>
                        `;
                    });
                }
                
                clientsHTML += '</div>';
                
                section.innerHTML = teamCard + clientsHTML;
                scoresGrid.appendChild(section);
            });
        }
        
        // 初期表示
        updateDisplay();
    </script>
</body>
</html>
