<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>親機 - 点数集計システム</title>
    <link rel="stylesheet" href="styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="parent-page">
    <header class="header">
        <h1>親機 - 点数集計システム</h1>
        <div class="server-status">
            <span class="status-dot"></span>
            <span>サーバー稼働中 (ポート: 5555)</span>
        </div>
    </header>

    <main class="main-container">
        <!-- カラム1: コントロールパネル -->
        <div class="column column-control">
            <!-- 得点発表 -->
            <div class="control-card">
                <h3>得点発表</h3>
                <div class="button-group">
                    <button class="btn btn-primary btn-full" onclick="showRanking()">
                        ウィンドウ表示
                    </button>
                    <button class="btn btn-primary btn-full" onclick="showRankingFullscreen()">
                        フルスクリーン表示
                    </button>
                    <div class="button-row-action">
                        <button class="btn btn-danger btn-action btn-go" onclick="triggerGo()">
                            得点GO!
                        </button>
                        <button class="btn btn-primary btn-action" onclick="resetRanking()">
                            リセット
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- システム -->
            <div class="control-card">
                <h3>システム</h3>
                <div class="button-group">
                    <button type="button" id="toggleLockAllBtn" class="btn btn-lock-toggle btn-full"
                            onclick="toggleLockAll()" aria-pressed="false">
                        ロック
                    </button>
                    <button class="btn btn-primary btn-full" onclick="resetCurrentRound()">
                        現在のラウンドをリセット
                    </button>
                    <button class="btn btn-danger btn-full" onclick="resetAllRounds()">
                        全ラウンドリセット
                    </button>
                    <button class="btn btn-primary btn-full" onclick="openSettings()">
                        設定…
                    </button>
                </div>
            </div>
        </div>

        <!-- カラム2: 子機情報 -->
        <div class="column column-clients">
            <div class="client-info-card">
                <div class="client-header">
                    <h3>子機情報</h3>
                    <span class="client-count-badge">接続中: <span id="clientCount">0</span>台</span>
                </div>
                <div class="table-wrapper">
                    <table class="score-table">
                        <colgroup>
                            <col class="col-client">
                            <col class="col-score">
                            <col class="col-status">
                            <col class="col-remind">
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="col-client-head">子機名</th>
                                <th class="col-score-head">点数</th>
                                <th class="col-status-head">状態</th>
                                <th class="col-remind-head">催促</th>
                            </tr>
                        </thead>
                        <tbody id="scoreTableBody">
                            <tr>
                                <td colspan="4" class="no-data">子機からの接続を待っています...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- カラム3: 合計得点 -->
        <div class="column column-total">
            <div class="total-score-card">
                <h2>合計得点</h2>
                <div class="total-display" id="totalScore">0</div>
                <p class="total-label">点</p>
            </div>
            
            <div class="round-card">
                <h3>チーム選択</h3>
                <div class="round-selector-buttons">
                    <button type="button" class="btn btn-round" onclick="switchRound(1)">A</button>
                    <button type="button" class="btn btn-round" onclick="switchRound(2)">B</button>
                    <button type="button" class="btn btn-round" onclick="switchRound(3)">C</button>
                    <button type="button" class="btn btn-round" onclick="switchRound(4)">D</button>
                    <button type="button" class="btn btn-round" onclick="switchRound(5)">E</button>
                </div>
                <div class="current-round-display">
                    現在: <span id="currentRoundLabel">チームA</span>
                </div>
                
                <div class="round-scores-summary">
                    <h4>各チーム得点</h4>
                    <div class="round-score-list" id="roundScoreList">
                        <div class="round-score-item">A: <span id="round1Total">0</span>点</div>
                        <div class="round-score-item">B: <span id="round2Total">0</span>点</div>
                        <div class="round-score-item">C: <span id="round3Total">0</span>点</div>
                        <div class="round-score-item">D: <span id="round4Total">0</span>点</div>
                        <div class="round-score-item">E: <span id="round5Total">0</span>点</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const socket = io();
        let clients = [];
        let currentRound = 1;
        let teamNames = ['A', 'B', 'C', 'D', 'E']; // デフォルト（5チーム）
        const REMIND_PRESS_MS = 5000;
        const remindPressedClients = new Set();
        const remindPressTimers = new Map();

        function clearRemindPressTimer(clientName) {
            const timer = remindPressTimers.get(clientName);
            if (timer) {
                clearTimeout(timer);
                remindPressTimers.delete(clientName);
            }
        }

        function endRemindPress(clientName) {
            clearRemindPressTimer(clientName);
            remindPressedClients.delete(clientName);
            updateDisplay();
        }

        function startRemindPress(clientName, durationMs) {
            clearRemindPressTimer(clientName);
            remindPressedClients.add(clientName);
            updateDisplay();
            const ms = typeof durationMs === 'number' && durationMs > 0 ? durationMs : REMIND_PRESS_MS;
            remindPressTimers.set(
                clientName,
                setTimeout(() => endRemindPress(clientName), ms)
            );
        }

        // チーム名を受信
        socket.on('team-names', (data) => {
            teamNames = data.teamNames;
            console.log('チーム名受信:', teamNames);
            updateRoundButtons();
            updateCurrentRoundLabel();
        });

        socket.on('client-connected', (data) => {
            clients = data.clients;
            updateDisplay();
        });

        socket.on('score-updated', (data) => {
            clients = data.clients;
            updateDisplay();
        });

        // 子機情報を受信
        socket.on('clients-data', (data) => {
            clients = data.clients;
            updateDisplay();
            console.log('子機情報を受信:', clients);
        });

        // チーム別の合計を受信
        socket.on('team-totals', (data) => {
            console.log('チーム別合計受信:', data);
            // 各チームの合計を表示
            data.teams.forEach((team, index) => {
                const total = team.score || 0;
                document.getElementById(`round${index + 1}Total`).textContent = total.toLocaleString();
            });
        });

        socket.on('client-disconnected', (data) => {
            clients = data.clients;
            updateDisplay();
        });

        socket.on('remind-started', (data) => {
            if (data?.clientName) {
                startRemindPress(data.clientName, data.durationMs);
            }
        });

        socket.on('remind-ended', (data) => {
            if (data?.clientName) {
                endRemindPress(data.clientName);
            }
        });

        function clientLabel(c) {
            return c.displayName || c.name;
        }

        function formatStatusCell(c) {
            if (c.unlockRequested) {
                const id = c.name.replace(/'/g, "\\'");
                return `<button class="status-badge unlock-request-badge" onclick="unlockClient('${id}')">解除申請</button>`;
            }
            if (c.locked) {
                return '<span class="status-badge locked">ロック中</span>';
            }
            if (c.entering) {
                return '<span class="status-badge entering">入力中</span>';
            }
            return '<span class="status-badge unlocked">入力可能</span>';
        }

        function updateDisplay() {
            const connectedClients = clients.filter((c) => c.connected);
            const total = connectedClients.reduce((sum, c) => sum + (c.score || 0), 0);
            document.getElementById('totalScore').textContent = total.toLocaleString();
            document.getElementById('clientCount').textContent = connectedClients.length;

            const tbody = document.getElementById('scoreTableBody');
            if (connectedClients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-data">子機からの接続を待っています...</td></tr>';
                return;
            }

            updateLockToggleButton();

            tbody.innerHTML = connectedClients.map((c) => {
                const id = c.name.replace(/'/g, "\\'");
                const idNote = c.displayName && c.displayName !== c.name
                    ? `<span class="client-id-sub">${c.name}</span>`
                    : '';
                const scoreClass = c.entering && c.draftScore !== null
                    ? 'score-value score-value-entering'
                    : 'score-value';
                const remindClass = remindPressedClients.has(c.name)
                    ? 'btn-remind is-pressed'
                    : 'btn-remind';
                return `
                    <tr>
                        <td class="client-name-cell">${clientLabel(c)}${idNote}</td>
                        <td class="${scoreClass}">${c.score ?? 0}点</td>
                        <td class="status-cell">${formatStatusCell(c)}</td>
                        <td class="remind-cell">
                            <button type="button" class="${remindClass}" onclick="remindClient('${id}')">催促</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        function unlockClient(clientName) {
            socket.emit('unlock-client', { clientName });
        }

        function remindClient(clientName) {
            socket.emit('remind-client', { clientName });
        }

        async function isServerRunning() {
            try {
                const response = await fetch('/', { method: 'GET', cache: 'no-store' });
                return response.ok;
            } catch {
                return false;
            }
        }

        function alertServerNotRunning() {
            alert('サーバーが起動していません。ランチャーで「サーバーを起動」してから操作してください。');
        }

        async function showRanking() {
            if (!(await isServerRunning())) {
                alertServerNotRunning();
                return;
            }
            window.open('/ranking', '_blank', 'width=1280,height=720');
        }

        async function showRankingFullscreen() {
            if (window.syukeiDesktop?.openScoreFullscreen) {
                const result = await window.syukeiDesktop.openScoreFullscreen();
                if (!result?.ok) {
                    alert(result?.error || 'サーバーが起動していません。');
                }
                return;
            }
            if (!(await isServerRunning())) {
                alertServerNotRunning();
                return;
            }
            const popup = window.open('/ranking', '_blank', 'width=1280,height=720');
            if (!popup) {
                alert('ポップアップがブロックされました。');
                return;
            }
            popup.addEventListener('load', () => {
                try {
                    popup.document.documentElement.requestFullscreen?.();
                } catch {
                    // ブラウザのみの場合は F11 を案内
                }
            });
        }

        function triggerGo() {
            // 全てのランキングウィンドウに得点GO信号を送信
            socket.emit('trigger-go');
        }

        function updateLockToggleButton() {
            const btn = document.getElementById('toggleLockAllBtn');
            if (!btn) {
                return;
            }
            const connected = clients.filter((c) => c.connected);
            if (connected.length === 0) {
                btn.textContent = 'ロック';
                btn.disabled = true;
                btn.setAttribute('aria-pressed', 'false');
                btn.classList.remove('is-toggle-pressed');
                return;
            }
            btn.disabled = false;
            const allLocked = connected.every((c) => c.locked);
            btn.textContent = allLocked ? 'ロック解除' : 'ロック';
            btn.setAttribute('aria-pressed', allLocked ? 'true' : 'false');
            btn.classList.toggle('is-toggle-pressed', allLocked);
        }

        function toggleLockAll() {
            const connected = clients.filter((c) => c.connected);
            if (connected.length === 0) {
                return;
            }
            const allLocked = connected.every((c) => c.locked);
            if (allLocked) {
                socket.emit('unlock-all');
            } else {
                socket.emit('lock-all');
            }
        }

        function unlockAll() {
            socket.emit('unlock-all');
        }

        function lockAll() {
            socket.emit('lock-all');
        }

        function resetRanking() {
            // ランキング画面を000にリセット
            socket.emit('reset-ranking');
        }

        async function openSettings() {
            if (window.syukeiDesktop?.openSettings) {
                const result = await window.syukeiDesktop.openSettings();
                if (!result?.ok) {
                    alert(result?.error || '設定を開けませんでした。');
                }
                return;
            }
            if (!(await isServerRunning())) {
                alertServerNotRunning();
                return;
            }
            window.open('/settings', 'syukei-settings', 'width=980,height=720,menubar=no,toolbar=no');
        }

        function resetCurrentRound() {
            const roundLabel = teamNames[currentRound - 1];
            if (confirm(`${roundLabel}のスコアをリセットしますか？`)) {
                socket.emit('reset-current-round', currentRound);
            }
        }

        function resetAllRounds() {
            if (confirm('全チームのスコアをリセットしますか？この操作は取り消せません。')) {
                socket.emit('reset-all-rounds');
            }
        }

        function switchRound(round) {
            currentRound = round;
            updateCurrentRoundLabel();
            
            // アクティブボタンの切り替え
            document.querySelectorAll('.btn-round').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // サーバーにラウンド変更を通知
            socket.emit('change-round', round);
            
            // ラウンド別データを要求
            socket.emit('request-round-data', round);
            
            // チーム合計を更新
            socket.emit('request-team-totals');
        }
        
        function updateCurrentRoundLabel() {
            const label = teamNames[currentRound - 1];
            document.getElementById('currentRoundLabel').textContent = label;
        }
        
        function updateRoundButtons() {
            const buttons = document.querySelectorAll('.btn-round');
            buttons.forEach((btn, index) => {
                btn.textContent = teamNames[index].replace(/チーム/g, '').substring(0, 10);
            });
        }

        // ラウンド別データを受信
        socket.on('round-data', (data) => {
            console.log('ラウンドデータ受信:', data);
            // 完全に新しいデータで置き換え
            clients = data.clients || [];
            updateDisplay();
        });

        socket.on('client-display-names', () => {
            socket.emit('request-clients');
        });

        socket.on('connect', () => {
            console.log('サーバーに接続しました');
            socket.emit('request-current-round');
            socket.emit('request-team-totals');
            socket.emit('request-clients');
            socket.emit('request-team-names');
        });
    </script>
</body>
</html>
