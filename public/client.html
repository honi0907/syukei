<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子機 - 点数入力</title>
    <link rel="stylesheet" href="styles.css?v=numpad-ten-2">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/server-host.js"></script>
    <script>
        (function () {
            const p = new URLSearchParams(window.location.search);
            if (p.get('electron') === '1' && p.get('skipLogin') === '1' && p.get('clientId')) {
                document.documentElement.classList.add('electron-auto-connect');
            }
        })();
    </script>
</head>
<body class="client-page">
    <!-- ログイン画面 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1>子機 初期設定</h1>
            <div class="login-form">
                <label for="clientId">子機ID</label>
                <select id="clientId" class="client-id-select">
                    <option value="ID1">ID1</option>
                    <option value="ID2">ID2</option>
                    <option value="ID3">ID3</option>
                    <option value="ID4">ID4</option>
                    <option value="ID5">ID5</option>
                    <option value="ID6">ID6</option>
                    <option value="ID7">ID7</option>
                    <option value="ID8">ID8</option>
                    <option value="ID9">ID9</option>
                    <option value="ID10">ID10</option>
                    <option value="test">test（デバッグ）</option>
                </select>
                <p id="clientDisplayNameHint" class="login-hint">表示名: ID1</p>
                
                <label for="serverHost">サーバーアドレス</label>
                <input type="text" id="serverHost" placeholder="例: localhost" value="localhost">
                
                <button class="btn btn-primary btn-large" onclick="login()">
                    接続して開始
                </button>
                
                <div id="loginStatus" class="status-message"></div>
            </div>
        </div>
    </div>

    <div id="electronConnecting" class="electron-connecting" hidden>
        <p>接続中…</p>
    </div>

    <!-- 入力画面 -->
    <div id="inputScreen" class="input-screen" style="display: none;">
        <header class="header">
            <h1 id="clientNameDisplay">子機</h1>
            <div class="header-info">
                <div class="round-display">
                    現在: <span id="currentRoundDisplay">チームA</span>
                </div>
                <div id="connectionStatus" class="connection-status">
                    <span class="status-dot"></span>
                    <span>接続済</span>
                </div>
            </div>
        </header>

        <main class="main-container">
            <!-- 左側: 送信履歴 -->
            <div class="left-panel">
                <div class="history-card-compact">
                    <h3>送信履歴</h3>
                    <div id="historyList" class="history-list-compact">
                        <p class="no-history">まだ送信していません</p>
                    </div>
                </div>
            </div>

            <!-- 中央: テンキー -->
            <div class="center-panel" id="centerPanel">
                <!-- ロック状態バー -->
                <div id="lockStatusBar" class="lock-status-bar unlocked">
                    <span id="lockStatusText">入力可能</span>
                </div>

                <!-- ボタングリッド -->
                <div class="numpad" id="numpad">
                    <button type="button" class="num-btn" data-number="1" onclick="addNumber(1)">1</button>
                    <button type="button" class="num-btn" data-number="2" onclick="addNumber(2)">2</button>
                    <button type="button" class="num-btn" data-number="3" onclick="addNumber(3)">3</button>
                    <button type="button" class="num-btn" data-number="4" onclick="addNumber(4)">4</button>
                    <button type="button" class="num-btn" data-number="5" onclick="addNumber(5)">5</button>
                    <button type="button" class="num-btn" data-number="6" onclick="addNumber(6)">6</button>
                    <button type="button" class="num-btn" data-number="7" onclick="addNumber(7)">7</button>
                    <button type="button" class="num-btn" data-number="8" onclick="addNumber(8)">8</button>
                    <button type="button" class="num-btn" data-number="9" onclick="addNumber(9)">9</button>
                    <button type="button" class="num-btn clear" onclick="clearScore()">クリア</button>
                    <button type="button" class="num-btn num-btn-ten" id="tenBtn" onclick="setScoreTen()" aria-label="10点">
                        <span class="num-btn-digits"><span>1</span><span>0</span></span>
                    </button>
                    <button type="button" class="num-btn submit" onclick="submitScore()">決定</button>
                </div>
            </div>

            <!-- 右側: 入力点数 -->
            <div class="right-panel">
                <div class="score-display-card">
                    <h2>入力点数</h2>
                    <div class="current-score" id="currentScore" role="button" tabindex="0">0</div>
                    <p class="guide-text">数字を入力して「決定」を押してください</p>
                    <p class="warning-text" id="warningText">※ 10点までしか入力できません</p>
                </div>
                <button class="btn btn-unlock-request" id="unlockRequestBtn" onclick="requestUnlock()" style="display: none;">
                    打ち直し申請
                </button>
            </div>
        </main>
    </div>

    <div id="parentRemindOverlay" class="parent-remind-overlay" hidden role="alert" aria-live="assertive" aria-labelledby="parentRemindText">
        <div class="parent-remind-panel">
            <p id="parentRemindText" class="parent-remind-message">点数を入力してください！</p>
        </div>
    </div>

    <script>
        let socket;
        let clientName = '';
        let clientDisplayName = '';
        let currentScore = 0;
        let isLocked = false;
        let unlockRequested = false;
        let currentRound = 1;
        const TEAM_COUNT = 6;
        let teamNames = ['A', 'B', 'C', 'D', 'E', 'F'];
        let roundHistory = {
            1: null, 2: null, 3: null, 4: null, 5: null
        }; // チーム別履歴(各チーム最新1件のみ)
        let testMode = false; // デバッグモード（子機名がtestの場合true）
        const MAX_SCORE = 10;

        let clickCount = 0;
        let clickTimer = null;
        let parentRemindTimer = null;
        const pageParams = new URLSearchParams(window.location.search);

        function migrateSavedClientId(saved) {
            if (!saved) {
                return 'ID1';
            }
            const idMatch = saved.match(/^ID(\d+)$/i);
            if (idMatch) {
                const n = Number(idMatch[1]);
                if (n >= 1 && n <= 10) {
                    return `ID${n}`;
                }
            }
            const legacy = saved.match(/^子機(\d+)$/);
            if (legacy) {
                const n = Number(legacy[1]);
                if (n >= 1 && n <= 10) {
                    return `ID${n}`;
                }
            }
            if (saved.toLowerCase() === 'test') {
                return 'test';
            }
            return 'ID1';
        }

        function updateClientIdHint() {
            const select = document.getElementById('clientId');
            const hint = document.getElementById('clientDisplayNameHint');
            if (!select || !hint) {
                return;
            }
            const label = clientDisplayName || select.value;
            hint.textContent = `表示名: ${label}`;
        }

        // ページ読み込み時に保存された値を復元
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const savedClientName = localStorage.getItem('clientName');
            const savedServerHost = localStorage.getItem('serverHost');

            let host = '';
            if (params.get('serverHost')) {
                host = normalizeServerHost(params.get('serverHost'));
            } else if (savedServerHost) {
                host = normalizeServerHost(savedServerHost);
            } else if (window.location.hostname) {
                host = normalizeServerHost(window.location.hostname);
            }
            if (!host) {
                host = 'localhost';
            }

            const clientIdEl = document.getElementById('clientId');
            const paramClientId = params.get('clientId');
            const skipLogin = params.get('electron') === '1' && params.get('skipLogin') === '1' && paramClientId;

            const resolvedId = migrateSavedClientId(paramClientId || savedClientName);
            if (clientIdEl) {
                clientIdEl.value = resolvedId;
                clientIdEl.addEventListener('change', updateClientIdHint);
            }
            updateClientIdHint();
            document.getElementById('serverHost').value = host;
            localStorage.setItem('serverHost', host);

            if (skipLogin) {
                document.getElementById('loginScreen').style.display = 'none';
                const connecting = document.getElementById('electronConnecting');
                if (connecting) {
                    connecting.hidden = false;
                }
                localStorage.setItem('clientName', resolvedId);
                setTimeout(() => login(), 80);
            } else if (params.get('electron') === '1' && savedClientName) {
                setTimeout(() => login(), 300);
            }
        });

        function login() {
            const idSelect = document.getElementById('clientId');
            const name = (idSelect?.value || '').trim();
            const host = normalizeServerHost(document.getElementById('serverHost').value.trim());
            document.getElementById('serverHost').value = host;
            
            if (!name) {
                showLoginStatus('子機IDを選択してください', 'error');
                return;
            }
            if (!host) {
                showLoginStatus('サーバーアドレスを入力してください', 'error');
                return;
            }

            showLoginStatus('接続中...', 'info');
            clientName = name;
            
            // 子機名が"test"の場合はデバッグモード
            testMode = (name.toLowerCase() === 'test');
            if (testMode) {
                console.log('🔓 デバッグモード: 点数制限解除');
            }

            // ローカルストレージに保存
            localStorage.setItem('clientName', name);
            localStorage.setItem('serverHost', host);

            // Socket.io接続
            socket = io(`http://${host}:5555`);

            socket.on('connect', () => {
                socket.emit('register', { clientName: name });
                showLoginStatus('接続成功', 'success');
                
                // チーム名をリクエスト
                socket.emit('request-team-names');
                
                setTimeout(() => {
                    document.getElementById('loginScreen').style.display = 'none';
                    const connecting = document.getElementById('electronConnecting');
                    if (connecting) {
                        connecting.hidden = true;
                    }
                    document.getElementById('inputScreen').style.display = 'block';
                    const nameDisplay = document.getElementById('clientNameDisplay');
                    nameDisplay.textContent = clientDisplayName || name;
                    
                    // testモードの場合は警告文を変更
                    if (testMode) {
                        const warningText = document.getElementById('warningText');
                        warningText.textContent = '🔓 デバッグモード: 999点まで入力可能';
                        warningText.style.color = '#e74c3c';
                    }
                    
                    // Electron 起動時はランチャー側でウィンドウ FS を設定。ブラウザ単体は従来どおり FS 可
                    const electronFs = pageParams.get('startFullscreen') === '1';
                    if (!window.kokiWindow && electronFs) {
                        enterFullscreen();
                    }

                    // 左上表示名を3回クリックでフルスクリーン ON/OFF
                    nameDisplay.style.cursor = 'pointer';
                    nameDisplay.title = '3回クリックでフルスクリーン切替';
                    nameDisplay.addEventListener('click', handleNameClick);

                    const scoreEl = document.getElementById('currentScore');
                    scoreEl.style.cursor = 'pointer';
                    scoreEl.addEventListener('click', () => {
                        if (!isLocked) {
                            notifyEntering();
                        }
                    });
                    
                    // 初期表示として履歴を表示
                    updateHistoryDisplay();
                }, 1000);
            });

            socket.on('connect_error', () => {
                const connecting = document.getElementById('electronConnecting');
                if (connecting && !connecting.hidden) {
                    connecting.innerHTML =
                        '<p>接続に失敗しました。<br>ウィンドウを閉じて、ランチャーからやり直してください。</p>';
                    return;
                }
                showLoginStatus('✗ 接続失敗: サーバーに接続できません', 'error');
            });
            
            socket.on('client-display-names', (data) => {
                if (data.myDisplayName) {
                    clientDisplayName = data.myDisplayName;
                } else if (Array.isArray(data.names)) {
                    const sel = document.getElementById('clientId');
                    const raw = data.myId || sel?.value;
                    const n = Number(String(raw || '').replace(/^ID/i, ''));
                    if (n >= 1 && n <= 10) {
                        clientDisplayName = data.names[n - 1] || raw;
                    }
                }
                const nameDisplay = document.getElementById('clientNameDisplay');
                if (nameDisplay && clientDisplayName) {
                    nameDisplay.textContent = clientDisplayName;
                }
                updateClientIdHint();
            });

            // チーム名を受信
            socket.on('team-names', (data) => {
                teamNames = data.teamNames;
                console.log('チーム名受信:', data);
                updateCurrentRoundDisplay();
                updateHistoryDisplay();
            });

            socket.on('set-changed', (data) => {
                if (Array.isArray(data.teamNames)) {
                    teamNames = data.teamNames;
                }
                updateCurrentRoundDisplay();
                updateHistoryDisplay();
            });

            socket.on('lock-status', (data) => {
                setLockStatus(data.locked);
            });

            socket.on('score-submitted', (data) => {
                // 履歴を上書き(ラウンド別、最新1件のみ)
                const now = new Date();
                const timeStr = now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                roundHistory[currentRound] = {
                    time: timeStr,
                    score: data.score,
                    round: currentRound
                };
                updateHistoryDisplay();
                
                currentScore = 0;
                updateScoreDisplay();
                updateButtonStates();
                
                // 送信完了メッセージを表示
                const bar = document.getElementById('lockStatusBar');
                const text = document.getElementById('lockStatusText');
                bar.className = 'lock-status-bar locked';
                text.textContent = `${data.score}点を送信しました`;
                
                // 1.5秒後にロック中表示に戻す
                setTimeout(() => {
                    text.textContent = 'ロック中 - 親機で解除してください';
                }, 1500);
                
                // 送信後は自動ロックされ、打ち直し申請ボタンを表示
                document.getElementById('unlockRequestBtn').style.display = 'block';
                unlockRequested = false;
            });

            socket.on('error', (data) => {
                if (!data?.message) {
                    return;
                }
                const onLogin = document.getElementById('loginScreen')?.style.display !== 'none';
                if (onLogin) {
                    showLoginStatus(data.message, 'error');
                } else {
                    showError(data.message);
                }
            });

            socket.on('parent-remind', (data) => {
                showParentRemind(data?.message);
            });

            // ラウンド変更を受信
            socket.on('round-changed', (round) => {
                currentRound = round;
                updateCurrentRoundDisplay();
                
                // ラウンド切り替え時に入力点数をリセット
                currentScore = 0;
                updateScoreDisplay();
                updateHistoryDisplay();
            });
        }
        
        function updateCurrentRoundDisplay() {
            const label = teamNames[currentRound - 1];
            document.getElementById('currentRoundDisplay').textContent = label;
        }

        function showLoginStatus(message, type) {
            const status = document.getElementById('loginStatus');
            status.textContent = message;
            status.className = `status-message ${type}`;
        }

        function handleNameClick() {
            clickCount++;
            
            // 既存のタイマーをクリア
            if (clickTimer) {
                clearTimeout(clickTimer);
            }
            
            // 3回クリックでフルスクリーンのトグル（切り替え）
            if (clickCount === 3) {
                if (window.kokiWindow?.toggleFullscreen) {
                    window.kokiWindow.toggleFullscreen();
                } else if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                    exitFullscreen();
                } else {
                    enterFullscreen();
                }
                clickCount = 0;
            } else {
                // 1秒以内に3回クリックしないとリセット
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                }, 1000);
            }
        }

        function enterFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        function setEnteringBar() {
            if (isLocked || unlockRequested) {
                return;
            }
            const bar = document.getElementById('lockStatusBar');
            const text = document.getElementById('lockStatusText');
            bar.className = 'lock-status-bar entering';
            text.textContent = '入力中';
        }

        function notifyEntering() {
            if (!socket || isLocked || !clientName) {
                return;
            }
            setEnteringBar();
            socket.emit('score-entering', {
                clientName,
                active: true,
                score: currentScore
            });
        }

        function addNumber(num) {
            if (isLocked) return;

            let newScore;
            if (!testMode) {
                // 1〜9 は押すたびにその数字に置き換え（決定前の打ち直し）。10点は「10」ボタン
                newScore = num;
            } else {
                newScore = currentScore * 10 + num;
            }

            if (!testMode && newScore > MAX_SCORE) {
                showError(`${MAX_SCORE}点を超えることはできません`);
                return;
            }
            
            // testモードの場合は999点まで許可
            if (testMode && newScore > 999) {
                showError('999点を超えることはできません');
                return;
            }
            
            currentScore = newScore;
            updateScoreDisplay();
            updateButtonStates();
            notifyEntering();
        }

        function clearScore() {
            if (isLocked) return;
            currentScore = 0;
            updateScoreDisplay();
            updateButtonStates();
            notifyEntering();
        }

        function setScoreTen() {
            if (isLocked) return;
            if (testMode) {
                currentScore = 10;
            } else {
                currentScore = MAX_SCORE;
            }
            updateScoreDisplay();
            updateButtonStates();
            notifyEntering();
        }

        function submitScore() {
            if (isLocked) {
                showError('ロック中です');
                return;
            }

            if (currentScore === 0) {
                showError('0点は送信できません');
                return;
            }

            socket.emit('submit-score', {
                clientName,
                score: currentScore
            });
        }

        function requestUnlock() {
            if (!unlockRequested) {
                socket.emit('request-unlock', { clientName });
                unlockRequested = true;
                const centerPanel = document.getElementById('centerPanel');
                const bar = document.getElementById('lockStatusBar');
                const text = document.getElementById('lockStatusText');
                
                centerPanel.className = 'center-panel requesting';
                bar.className = 'lock-status-bar requesting';
                text.textContent = '解除申請を送信しました';
                
                // 1.5秒後に「申請中」表示に変更
                setTimeout(() => {
                    text.textContent = '申請中 - 親機の承認待ち';
                }, 1500);
            }
        }

        function updateScoreDisplay() {
            document.getElementById('currentScore').textContent = currentScore;
        }

        function updateButtonStates() {
            const buttons = document.querySelectorAll('.num-btn[data-number]');
            
            // testモードの場合はボタン制限なし（999点まで）
            if (testMode) {
                if (currentScore >= 100) {
                    // 3桁入力済み: 全て無効
                    buttons.forEach(btn => {
                        btn.classList.add('disabled-btn');
                        btn.disabled = true;
                    });
                } else {
                    // 999点以下: 全て有効
                    buttons.forEach(btn => {
                        btn.classList.remove('disabled-btn');
                        btn.disabled = false;
                    });
                }
                return;
            }
            
            // 通常モード: 決定までグレーアウトしない（10点超は addNumber で弾く）
            const tenBtn = document.getElementById('tenBtn');
            buttons.forEach(btn => {
                btn.classList.remove('disabled-btn');
                btn.disabled = false;
            });
            if (tenBtn) {
                tenBtn.classList.remove('disabled-btn');
                tenBtn.disabled = false;
            }
        }

        function setLockStatus(locked) {
            isLocked = locked;
            const bar = document.getElementById('lockStatusBar');
            const text = document.getElementById('lockStatusText');
            const buttons = document.querySelectorAll('.num-btn');
            const centerPanel = document.getElementById('centerPanel');

            if (locked) {
                // 申請中でない場合のみロック表示に変更
                if (!unlockRequested) {
                    bar.className = 'lock-status-bar locked';
                    text.textContent = 'ロック中 - 親機で解除してください';
                    centerPanel.className = 'center-panel locked';
                }
                buttons.forEach(btn => btn.disabled = true);
            } else {
                bar.className = 'lock-status-bar unlocked';
                text.textContent = '入力可能';
                buttons.forEach(btn => btn.disabled = false);
                updateButtonStates(); // ロック解除時にボタン状態を更新
                centerPanel.className = 'center-panel unlocked';
                
                // ロック解除時は打ち直し申請ボタンを非表示
                document.getElementById('unlockRequestBtn').style.display = 'none';
                unlockRequested = false;
            }
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function measureTextWidth(text, sizePx, style) {
            const canvas = measureTextWidth.canvas || (measureTextWidth.canvas = document.createElement('canvas'));
            const ctx = canvas.getContext('2d');
            const weight = style.fontWeight || '600';
            const family = style.fontFamily || 'sans-serif';
            ctx.font = `${weight} ${sizePx}px ${family}`;
            return ctx.measureText(text).width;
        }

        function fitHistoryTeamLine(roundTotalEl) {
            const nameEl = roundTotalEl.querySelector('.history-team-name');
            const scoreEl = roundTotalEl.querySelector('.history-team-score');
            if (!nameEl || !scoreEl) {
                return;
            }

            const boxStyle = getComputedStyle(roundTotalEl);
            const pad = (parseFloat(boxStyle.paddingLeft) || 0) + (parseFloat(boxStyle.paddingRight) || 0);
            const inner = roundTotalEl.clientWidth - pad;
            if (inner <= 8) {
                return;
            }

            const scoreStyle = getComputedStyle(scoreEl);
            const scoreSize = parseFloat(scoreStyle.fontSize) || 20;
            const scoreText = scoreEl.textContent || '';
            const scoreW = measureTextWidth(scoreText, scoreSize, scoreStyle) + 6;
            const available = inner - scoreW;
            if (available <= 4) {
                return;
            }

            const name = nameEl.textContent || '';
            const nameStyle = getComputedStyle(nameEl);
            const maxPx = 22;
            const minPx = 1;
            let lo = minPx;
            let hi = maxPx;
            let best = minPx;

            while (hi - lo > 0.25) {
                const mid = (lo + hi) / 2;
                if (measureTextWidth(name, mid, nameStyle) <= available) {
                    best = mid;
                    lo = mid;
                } else {
                    hi = mid;
                }
            }

            nameEl.style.fontSize = `${Math.floor(best * 10) / 10}px`;
            nameEl.style.maxWidth = 'none';
            nameEl.style.overflow = 'visible';
            nameEl.style.textOverflow = 'clip';
        }

        function fitAllHistoryTeamLines() {
            document.querySelectorAll('.history-list-compact .round-total').forEach(fitHistoryTeamLine);
        }

        let historyFitResizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(historyFitResizeTimer);
            historyFitResizeTimer = setTimeout(fitAllHistoryTeamLines, 100);
        });

        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');

            let html = '';

            for (let r = 1; r <= TEAM_COUNT; r++) {
                const roundData = roundHistory[r];
                const roundTotal = roundData ? roundData.score : 0;
                const teamLabel = teamNames[r - 1] || `チーム${r}`;

                html += `
                    <div class="round-history-section ${r === currentRound ? 'current-round' : ''}">
                        <div class="round-total">
                            <span class="history-team-name">${escapeHtml(teamLabel)}</span><span class="history-team-score">: ${roundTotal}点</span>
                        </div>
                    </div>
                `;
            }

            historyList.innerHTML = html;
            const runFit = () => {
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(fitAllHistoryTeamLines).catch(fitAllHistoryTeamLines);
                } else {
                    fitAllHistoryTeamLines();
                }
            };
            requestAnimationFrame(runFit);
            setTimeout(runFit, 50);
            setTimeout(runFit, 300);
        }

        if (typeof ResizeObserver !== 'undefined') {
            const historyListEl = document.getElementById('historyList');
            if (historyListEl) {
                new ResizeObserver(() => fitAllHistoryTeamLines()).observe(historyListEl);
            }
        }

        function addToHistory(score) {
            // この関数は削除（updateHistoryDisplayに統合）
        }

        function showSuccess(message) {
            const bar = document.getElementById('lockStatusBar');
            const text = document.getElementById('lockStatusText');
            
            bar.className = 'lock-status-bar success';
            text.textContent = message;
            
            setTimeout(() => {
                setLockStatus(true);
            }, 1500);
        }

        function showError(message) {
            const bar = document.getElementById('lockStatusBar');
            const text = document.getElementById('lockStatusText');
            const originalClass = bar.className;
            const originalText = text.textContent;
            
            bar.className = 'lock-status-bar error';
            text.textContent = message;
            
            setTimeout(() => {
                bar.className = originalClass;
                text.textContent = originalText;
            }, 3000);
        }

        function dismissParentRemind() {
            const overlay = document.getElementById('parentRemindOverlay');
            if (!overlay || overlay.hidden) {
                return;
            }
            overlay.hidden = true;
            if (parentRemindTimer) {
                clearTimeout(parentRemindTimer);
                parentRemindTimer = null;
            }
            if (socket?.connected && clientName) {
                socket.emit('remind-dismissed', { clientName });
            }
        }

        function showParentRemind(message) {
            const overlay = document.getElementById('parentRemindOverlay');
            const textEl = document.getElementById('parentRemindText');
            if (!overlay || !textEl) {
                return;
            }
            textEl.textContent = message || '点数を入力してください！';
            overlay.hidden = false;
            if (parentRemindTimer) {
                clearTimeout(parentRemindTimer);
            }
            parentRemindTimer = setTimeout(dismissParentRemind, 5000);
        }

        document.getElementById('parentRemindOverlay')?.addEventListener('click', dismissParentRemind);
    </script>
</body>
</html>
